version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: komagu-demo-postgres
    environment:
      POSTGRES_DB: member_portal
      POSTGRES_USER: komagu
      POSTGRES_PASSWORD: komagu_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komagu -d member_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-dotnet:
    build:
      context: ../..
      dockerfile: examples/member-portal/backend-dotnet/Dockerfile
    container_name: komagu-demo-dotnet
    environment:
      ASPNETCORE_URLS: "http://+:5001"
      ENABLE_SECURITY_TEST_VULNERABILITIES: "true"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/member_portal.db"
    ports:
      - "5001:5001"
    volumes:
      - dotnet-data:/app/data

  backend-spring:
    build:
      context: ../..
      dockerfile: examples/member-portal/backend-spring/Dockerfile
    container_name: komagu-demo-spring
    environment:
      SERVER_PORT: "5002"
      ENABLE_SECURITY_TEST_VULNERABILITIES: "true"
    ports:
      - "5002:5002"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: komagu-demo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-dotnet

volumes:
  pgdata:
  dotnet-data:
