server.port=8082
spring.application.name=member-portal-backend-spring

# H2 In-Memory Database for fast reference run
spring.datasource.url=jdbc:h2:mem:memberportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

enable.security.test.vulnerabilities=true
