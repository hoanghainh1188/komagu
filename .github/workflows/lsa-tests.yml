name: LSA tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The kit promises Python 3.8+; test the oldest and a current version.
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test
        run: python3 assess/lsa/tests/run_tests.py
      - name: Build adapters
        run: |
          for t in claude-code cursor generic; do
            python3 assess/lsa/adapters/build_adapters.py "$t" "$RUNNER_TEMP/adapters/$t"
          done
