name: LSA tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The kit promises Python 3.8+; test the oldest and a current version.
        python: ["3.8", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Self-test
        run: python3 assess/lsa/tests/run_tests.py

      - name: Build adapters
        run: |
          for t in claude-code cursor generic; do
            python3 assess/lsa/adapters/build_adapters.py "$t" "$RUNNER_TEMP/adapters/$t"
          done
