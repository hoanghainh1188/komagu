name: LSA tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The kit promises Python 3.8+; test the oldest and a current version.
        python: ["3.8", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}

      - name: Self-test
        run: python3 assess/lsa/tests/run_tests.py

      - name: Build adapters
        run: |
          for t in claude-code cursor generic; do
            python3 assess/lsa/adapters/build_adapters.py "$t" "$RUNNER_TEMP/adapters/$t"
          done
