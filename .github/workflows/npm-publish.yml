# Komainu — npmjs Publication Workflow
#
# Release Pathways:
# 1. CI Automated Publishing (OIDC / Token):
#    - Pending resolution of upstream issue npm/cli#9969 (Immutable OIDC claims on GitHub repos).
#    - npm registry currently restricts bypass-2FA granular tokens on 2FA-enforced personal accounts.
# 2. Local Manual Publishing (Recommended & Verified):
#    - Run locally with active 2FA OTP:
#      npm login
#      npm publish --access public

name: Publish to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish to npmjs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade npm to latest version
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify CLI wrapper
        run: |
          node bin/komainu.js --version
          node bin/komainu.js scan --help
          node bin/komainu.js protect --dry-run
          node bin/komainu.js demo --dry-run

      - name: Publish package to npmjs
        run: |
          echo "Attempting publication to npmjs..."
          if ! npm publish --access public; then
            echo "::warning title=npm Publish Challenge::npm publish via CI encountered an authentication or 2FA challenge."
            echo "::notice title=Release Instructions::If npm requires interactive 2FA/OTP or upstream OIDC #9969 is active, publish from local terminal:"
            echo "::notice title=Release Instructions::  cd /path/to/komainu && npm login && npm publish --access public"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
