# Komainu — Hardened npmjs Publication Workflow via Pure OIDC
#
# Release Security Gate Note:
# - environment: npm-release is configured for deployment tracking and auditability.
# - On GitHub Free with private repositories, environment protection rules (such as
#   required reviewers) are not supported. Therefore, the effective release gate in
#   this repository setup is restricted to collaborators with release-creation permissions.
# - Provenance: --provenance is omitted because npm registry rejects build provenance
#   from private GitHub repositories.

name: Publish to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Verify & Publish to npmjs
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Pin npm version
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Run test suites before publish
        run: |
          npm test
          python3 assess/lsa/tests/run_tests.py

      - name: Verify CLI wrapper
        run: |
          node bin/komainu.js --version
          node bin/komainu.js scan --help
          node bin/komainu.js protect --dry-run
          node bin/komainu.js demo --dry-run

      - name: Publish package to npmjs via OIDC
        run: |
          echo "Publishing to npmjs via OIDC trusted publishing..."
          npm publish --access public
