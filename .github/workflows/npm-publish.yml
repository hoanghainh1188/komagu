name: Publish to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade npm to latest version for Trusted Publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify CLI wrapper
        run: |
          node bin/komainu.js --version
          node bin/komainu.js scan --help
          node bin/komainu.js protect --dry-run
          node bin/komainu.js demo --dry-run

      - name: Publish package to npmjs via Trusted Publishing (OIDC)
        run: |
          rm -f ~/.npmrc
          npm publish --access public --provenance
