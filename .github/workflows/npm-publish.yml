# Komainu — npmjs Publication Workflow via OIDC Trusted Publishing
#
# Works with the repository either public or private (no flag changes needed):
# - Public repo: npm generates build provenance automatically for trusted
#   publishing, and the npm-release environment can require reviewers
#   (Settings → Environments) as a real release gate.
# - Private repo (GitHub Free): npm does not generate provenance, and environment
#   protection rules are unavailable, so the effective gate is who can create a
#   release.
# --provenance is deliberately not passed: npm rejects it from private repositories.
#
# The release tag (vX.Y.Z) must match package.json and operate/cli/__init__.py;
# the first step fails fast otherwise.

name: Publish to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Verify & Publish to npmjs
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          cli=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('operate/cli/__init__.py').read_text()).group(1))")
          echo "tag=${tag} package.json=${pkg} operate/cli=${cli}"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cli" ]; then
            echo "::error title=Version mismatch::Release tag v${tag} must match package.json (${pkg}) and operate/cli/__init__.py (${cli})"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Pin npm version
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Run test suites before publish
        run: |
          npm test
          python3 assess/lsa/tests/run_tests.py

      - name: Verify CLI wrapper
        run: |
          node bin/komainu.js --version
          node bin/komainu.js scan --help
          node bin/komainu.js protect --dry-run
          node bin/komainu.js demo --dry-run

      - name: Publish package to npmjs via OIDC
        run: |
          echo "Publishing to npmjs via OIDC trusted publishing..."
          npm publish --access public
