name: Platform & Remediation Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-suites:
    name: Python Suites (Assess, Operate, Shims, Edge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node.js (for npx wrapper test)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"

      - name: Run LSA unit tests
        run: python3 -m unittest discover -s assess/lsa/tests -p "test_*.py"

      - name: Run Operate & CLI unit tests
        run: python3 -m unittest discover -s operate/tests -p "test_*.py"

      - name: Run Legacy Remediation Shims unit tests
        run: python3 -m unittest discover -s remediate/legacy_shims/tests -p "test_*.py"

      - name: Build Coraza WAF image
        run: docker build -t komagu-coraza-caddy:local remediate/edge/coraza

      - name: Run Edge Config verification tests
        env:
          # Load the real Caddy/Coraza config in the WAF image; fail instead of skipping
          KOMAGU_REQUIRE_WAF_TEST: "1"
        run: python3 -m unittest discover -s remediate/edge/tests -p "test_*.py"

      - name: Verify Komagu DevSecOps & SBOM CLI pipeline
        run: |
          python3 -m operate.cli.main devsecops sbom examples/member-portal --format cyclonedx -o /tmp/cyclonedx.json
          python3 -m operate.cli.main devsecops sbom examples/member-portal --format spdx -o /tmp/spdx.json
          python3 -m operate.cli.main devsecops run examples/member-portal -o /tmp/devsecops-output

      - name: Install Python dependencies (eKYC)
        run: pip install -r remediate/ekyc/requirements.txt

      - name: Run Zero-PII eKYC unit tests
        run: python3 -m unittest discover -s remediate/ekyc/tests -p "test_*.py"

      - name: Run Multi-Region Resilience & WORM Backup unit tests
        run: python3 -m unittest discover -s remediate/resilience/tests -p "test_*.py"

      - name: Run Tenant-Isolated SaaS & BYOK unit tests
        run: python3 -m unittest discover -s remediate/tenancy/tests -p "test_*.py"

      - name: Install Python dependencies (Authz & Identity)
        run: pip install -r remediate/identity/python/requirements.txt

      - name: Run Python D1/D2 Authz & D5 Continuous Verification tests
        run: |
          python3 -m unittest discover -s remediate/identity/python/tests -p "test_*.py"
          python3 -m unittest discover -s remediate/authz/python/tests -p "test_*.py"

      - name: Run Node.js / NestJS D1/D2 Authz unit tests
        run: node --test remediate/authz/nodejs/tests/test-authz.js

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Run Go D1 Authz unit tests
        working-directory: remediate/authz/golang
        run: go test -v ./...

  dotnet-suites:
    name: .NET 8 Suites (D1 Authz, D2 Identity, D3 Query, D6 Demo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python (for D6 integration test runner)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test D1 Object-Level Authorization (.NET 8)
        run: dotnet test remediate/authz/dotnet/tests/Komagu.Security.Authorization.Tests/Komagu.Security.Authorization.Tests.csproj

      - name: Test D2 OIDC Identity Integration (.NET 8)
        run: dotnet test remediate/identity/dotnet/tests/Komagu.Security.Identity.Tests/Komagu.Security.Identity.Tests.csproj

      - name: Test D3 Safe Query & Roslyn Analyzer (.NET 8)
        run: dotnet test remediate/query/dotnet/tests/Komagu.Security.Query.Tests/Komagu.Security.Query.Tests.csproj

      - name: Test D6 Member Portal End-to-End BOLA & D5 Continuous Authorization Verification
        run: python3 -m unittest discover -s examples/member-portal/tests -p "test_*.py"

  spring-suites:
    name: Kotlin / Spring Boot 3 Suites (D1 Authz, D2 Identity, D3 Query)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.10.2"

      - name: Test D1 Object-Level Authorization (Spring Boot 3)
        working-directory: remediate/authz/spring
        run: gradle test --no-daemon

      - name: Test D2 OIDC Identity Integration (Spring Boot 3)
        working-directory: remediate/identity/spring
        run: gradle test --no-daemon

      - name: Test D3 Safe Query & Detekt Rule (Spring Boot 3)
        working-directory: remediate/query/spring
        run: gradle test --no-daemon
