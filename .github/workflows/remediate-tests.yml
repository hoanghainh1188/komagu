name: Platform & Remediation Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-suites:
    name: Python Suites (Assess, Operate, Shims, Edge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js (for npx wrapper test)
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run LSA unit tests
        run: python3 -m unittest discover -s assess/lsa/tests -p "test_*.py"

      - name: Run Operate & CLI unit tests
        run: python3 -m unittest discover -s operate/tests -p "test_*.py"

      - name: Run Legacy Remediation Shims unit tests
        run: python3 -m unittest discover -s remediate/legacy_shims/tests -p "test_*.py"

      - name: Run Edge Config verification tests
        run: python3 -m unittest discover -s remediate/edge/tests -p "test_*.py"

      - name: Verify Komainu DevSecOps & SBOM CLI pipeline
        run: |
          python3 -m operate.cli.main devsecops sbom examples/member-portal --format cyclonedx -o /tmp/cyclonedx.json
          python3 -m operate.cli.main devsecops sbom examples/member-portal --format spdx -o /tmp/spdx.json
          python3 -m operate.cli.main devsecops run examples/member-portal -o /tmp/devsecops-output

      - name: Run Zero-PII eKYC unit tests
        run: python3 -m unittest discover -s remediate/ekyc/tests -p "test_*.py"

  dotnet-suites:
    name: .NET 8 Suites (D1 Authz, D2 Identity, D3 Query, D6 Demo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python (for D6 integration test runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test D1 Object-Level Authorization (.NET 8)
        run: dotnet test remediate/authz/dotnet/tests/Komainu.Security.Authorization.Tests/Komainu.Security.Authorization.Tests.csproj

      - name: Test D2 OIDC Identity Integration (.NET 8)
        run: dotnet test remediate/identity/dotnet/tests/Komainu.Security.Identity.Tests/Komainu.Security.Identity.Tests.csproj

      - name: Test D3 Safe Query & Roslyn Analyzer (.NET 8)
        run: dotnet test remediate/query/dotnet/tests/Komainu.Security.Query.Tests/Komainu.Security.Query.Tests.csproj

      - name: Test D6 Member Portal End-to-End BOLA & D5 Continuous Authorization Verification
        run: python3 -m unittest discover -s examples/member-portal/tests -p "test_*.py"

  spring-suites:
    name: Kotlin / Spring Boot 3 Suites (D1 Authz, D2 Identity, D3 Query)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test D1 Object-Level Authorization (Spring Boot 3)
        working-directory: remediate/authz/spring
        run: gradle test --no-daemon

      - name: Test D2 OIDC Identity Integration (Spring Boot 3)
        working-directory: remediate/identity/spring
        run: gradle test --no-daemon

      - name: Test D3 Safe Query & Detekt Rule (Spring Boot 3)
        working-directory: remediate/query/spring
        run: gradle test --no-daemon
