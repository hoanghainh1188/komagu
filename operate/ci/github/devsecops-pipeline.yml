name: Komainu DevSecOps, SCA & SBOM Supply Chain Security Pipeline

on:
  workflow_call:
    inputs:
      target-path:
        description: "Target directory path to inspect"
        required: false
        default: "."
        type: string
      app-name:
        description: "Application name for SBOM identification"
        required: false
        default: "Application"
        type: string
      app-version:
        description: "Application version for SBOM identification"
        required: false
        default: "1.0.0"
        type: string
      fail-on-severity:
        description: "Severity threshold that fails the pipeline (error, warning)"
        required: false
        default: "error"
        type: string
      enable-sast:
        description: "Enable Semgrep SAST scanning"
        required: false
        default: true
        type: boolean
      enable-secrets:
        description: "Enable Gitleaks secret scanning"
        required: false
        default: true
        type: boolean
      enable-sca:
        description: "Enable Trivy SCA dependency scanning"
        required: false
        default: true
        type: boolean
      enable-sbom:
        description: "Enable automated CycloneDX & SPDX SBOM generation"
        required: false
        default: true
        type: boolean
      enable-container:
        description: "Enable Trivy container and Dockerfile scanning"
        required: false
        default: true
        type: boolean
      upload-sarif-to-github:
        description: "Upload unified SARIF report to GitHub Code Scanning"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  devsecops-pipeline:
    name: DevSecOps & Supply Chain Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Komainu DevSecOps Dependencies
        run: |
          python3 -m pip install --upgrade pip

      - name: SAST Security Scanning (Semgrep)
        if: ${{ inputs.enable-sast }}
        continue-on-error: true
        run: |
          mkdir -p .komainu-devsecops
          if command -v semgrep &> /dev/null; then
            semgrep scan --config auto --sarif --output .komainu-devsecops/sast.sarif ${{ inputs.target-path }} || true
          else
            echo "Semgrep not pre-installed on runner; Komainu pipeline will use native AST analyzer"
          fi

      - name: Secret Leak Detection (Gitleaks)
        if: ${{ inputs.enable-secrets }}
        continue-on-error: true
        run: |
          mkdir -p .komainu-devsecops
          if command -v gitleaks &> /dev/null; then
            gitleaks detect --source ${{ inputs.target-path }} --format sarif --report-path .komainu-devsecops/secrets.sarif --no-git || true
          else
            echo "Gitleaks CLI not pre-installed; Komainu pipeline will use native high-entropy scanner"
          fi

      - name: SCA & Dependency Vulnerability Scan (Trivy)
        if: ${{ inputs.enable-sca }}
        continue-on-error: true
        run: |
          mkdir -p .komainu-devsecops
          if command -v trivy &> /dev/null; then
            trivy fs --format sarif --output .komainu-devsecops/sca.sarif ${{ inputs.target-path }} || true
          else
            echo "Trivy CLI not pre-installed; Komainu pipeline will use native manifest analyzer"
          fi

      - name: Execute Unified Komainu DevSecOps & SBOM Generator
        run: |
          python3 -m operate.cli.main devsecops run ${{ inputs.target-path }} \
            --output-dir .komainu-devsecops \
            --app-name "${{ inputs.app-name }}" \
            --app-version "${{ inputs.app-version }}"

      - name: Archive SBOM Compliance Artifacts
        if: ${{ inputs.enable-sbom }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom-compliance-artifacts
          path: |
            .komainu-devsecops/cyclonedx-sbom.json
            .komainu-devsecops/spdx-sbom.json
          retention-days: 30

      - name: Upload Unified SARIF to GitHub Security Tab
        if: ${{ inputs.upload-sarif-to-github && hashFiles('.komainu-devsecops/komainu-devsecops.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: .komainu-devsecops/komainu-devsecops.sarif
          category: komainu-devsecops
