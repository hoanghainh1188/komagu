# Kong profile for a legacy application that signs users in with a session cookie (JSESSIONID) and form actions.
# Every path goes to Coraza, and rate limiting is per client IP because these requests carry no JWT.
# Use it with: komagu protect --target <url> --config remediate/edge/kong/kong-legacy-session.yaml --up
_format_version: "3.0"

services:
  - name: komagu-legacy-app
    url: http://coraza-waf:8080
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: legacy-all-paths
        paths:
          - /
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
        plugins:
          - name: rate-limiting
            config:
              minute: 120
              second: 10
              limit_by: ip
              policy: redis
              fault_tolerant: false
              redis:
                host: redis
                port: 6379
                timeout: 2000
                database: 0
              hide_client_headers: false
              error_code: 429
              error_message: "Rate limit exceeded. Please back off and retry."

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true

  - name: response-transformer
    config:
      remove:
        headers:
          - X-Kong-Upstream-Latency
          - X-Kong-Proxy-Latency
          - Server
