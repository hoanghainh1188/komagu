# ==============================================================================
# Komainu Custom OWASP CRS v4 Tuning & Rule Exclusions
# ==============================================================================

# Allow application/json Content-Type
SecAction \
  "id:900200,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/x-amf| |application/json| |application/cloudevents+json| |application/problem+json|'"

# Custom rule: Explicitly ensure SQL injection indicators in query string or body trigger anomaly score >= 5
SecRule ARGS "@rx (?i)(?:(?:union\s+select)|(?:;\s*drop\s+table)|(?:'\s*or\s+'?1'?\s*=\s*'?1))" \
  "id:1000001,\
   phase:2,\
   deny,\
   status:403,\
   msg:'Komainu WAF: SQL Injection Attack Detected',\
   logdata:'Matched Data: %{TX.0}',\
   severity:'CRITICAL',\
   tag:'komainu-sqli',\
   setvar:'tx.sql_injection_score=+5',\
   setvar:'tx.inbound_anomaly_score_exceeded=1'"

# Custom rule: Explicitly ensure Cross-Site Scripting (XSS) indicators trigger HTTP 403
SecRule ARGS "@rx (?i)(?:<script[^>]*>|javascript:[^\"']*|onerror\s*=)" \
  "id:1000002,\
   phase:2,\
   deny,\
   status:403,\
   msg:'Komainu WAF: Cross-Site Scripting (XSS) Attack Detected',\
   logdata:'Matched Data: %{TX.0}',\
   severity:'CRITICAL',\
   tag:'komainu-xss',\
   setvar:'tx.xss_score=+5',\
   setvar:'tx.inbound_anomaly_score_exceeded=1'"

# Custom rule: Explicitly ensure Path Traversal indicators trigger HTTP 403
SecRule REQUEST_URI|ARGS "@rx (?i)(?:\.\./|\.\.\\)" \
  "id:1000003,\
   phase:1,\
   deny,\
   status:403,\
   msg:'Komainu WAF: Path Traversal Attack Detected',\
   logdata:'Matched Data: %{TX.0}',\
   severity:'CRITICAL',\
   tag:'komainu-path-traversal'"
