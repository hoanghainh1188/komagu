# ==============================================================================
# Komagu Custom OWASP CRS v4 Tuning & Rule Exclusions
# ==============================================================================

# Enable JSON request body inspection for application/json Content-Type
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^application/(?:[a-z0-9\-_.]+\+)?json" \
  "id:200001,\
   phase:1,\
   pass,\
   nolog,\
   t:none,\
   ctl:requestBodyProcessor=JSON"

# Allow application/json Content-Type in CRS allowed list
SecAction \
  "id:900200,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/x-amf| |application/json| |application/cloudevents+json| |application/problem+json|'"

# Custom rule: Ensure SQL injection indicators in query string, URI, JSON body, or headers trigger HTTP 403
# Tuned to prevent false positives on dashes, hash symbols, or benign words (e.g. ?q=a--b, ?name=C#)
SecRule ARGS|REQUEST_URI|REQUEST_HEADERS "@rx (?i)(?:(?:\bunion\b[\s\S]*?\bselect\b)|(?:\b(?:or|and)\b\s+(?:(?:\d+\s*=\s*\d+)|(?:['\"][^'\"]+['\"]\s*=\s*['\"]?[^'\"\s]+)|true\b|false\b))|(?:;\s*(?:drop|alter|truncate|delete)\s+table\b)|(?:\-\-(?:[\s+\r\n\t]|$))|(?:\/\*[\s\S]*?\*\/)|(?:['\"`]\s*#|#\s+))" \
  "id:1000001,\
   phase:2,\
   deny,\
   status:403,\
   t:urlDecodeUni,\
   t:lowercase,\
   msg:'Komagu WAF: SQL Injection Attack Detected',\
   logdata:'Matched Data: %{TX.0}',\
   severity:'CRITICAL',\
   tag:'komagu-sqli',\
   setvar:'tx.sql_injection_score=+5',\
   setvar:'tx.inbound_anomaly_score_exceeded=1'"

# Custom rule: Ensure Cross-Site Scripting (XSS) indicators trigger HTTP 403
SecRule ARGS|REQUEST_URI "@rx (?i)(?:<script[^>]*>|javascript:[^\"']*|onerror\s*=|onload\s*=|eval\s*\(|alert\s*\()" \
  "id:1000002,\
   phase:2,\
   deny,\
   status:403,\
   t:urlDecodeUni,\
   t:lowercase,\
   msg:'Komagu WAF: Cross-Site Scripting (XSS) Attack Detected',\
   logdata:'Matched Data: %{TX.0}',\
   severity:'CRITICAL',\
   tag:'komagu-xss',\
   setvar:'tx.xss_score=+5',\
   setvar:'tx.inbound_anomaly_score_exceeded=1'"

# Custom rule: Ensure Path Traversal indicators trigger HTTP 403
SecRule REQUEST_URI|ARGS "@rx (?i)(?:\.\./|\.\.\\)" \
  "id:1000003,\
   phase:1,\
   deny,\
   status:403,\
   t:urlDecodeUni,\
   msg:'Komagu WAF: Path Traversal Attack Detected',\
   logdata:'Matched Data: %{TX.0}',\
   severity:'CRITICAL',\
   tag:'komagu-path-traversal'"
