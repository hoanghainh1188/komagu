# ==============================================================================
# OWASP Coraza WAF Configuration for Komainu Modernization Kit (D4)
# ==============================================================================

# Enable WAF Rule Engine in active blocking mode
SecRuleEngine On

# Request Body Handling
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

# Response Body Handling (Disabled for API latency optimization)
SecResponseBodyAccess Off

# Default Action: Block immediately with HTTP 403 Forbidden on anomaly threshold violation
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# Anomaly Scoring & Paranoia Level (CRS v4 standards)
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1"

SecAction \
  "id:900001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5"

SecAction \
  "id:900002,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# Audit Logging (Structured JSON for SIEM ingestion)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5[0-9]{2}|4[0-9]{2})"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat json
SecAuditLog /dev/stdout
