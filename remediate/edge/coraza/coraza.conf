# ==============================================================================
# OWASP Coraza WAF Configuration for Komagu Modernization Kit (D4)
# ==============================================================================

# Enable WAF Rule Engine in active blocking mode
SecRuleEngine On

# Request Body Handling
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

# Response Body Handling (Disabled for API latency optimization)
SecResponseBodyAccess Off

# No SecDefaultAction here: @crs-setup.conf.example (included after this file)
# defines it for phases 1 and 2, and Coraza refuses to load a second definition.
# CRS blocks with 403 once the inbound anomaly score reaches the threshold below,
# and the Komagu custom rules deny with status:403 explicitly.

# Anomaly Scoring & Paranoia Level (CRS v4 standards)
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1"

SecAction \
  "id:900001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=5"

SecAction \
  "id:900002,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# Audit Logging (Structured JSON for SIEM ingestion)
# Drops B (request headers) and I (request body) to prevent credential and PII leakage
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5[0-9]{2}|4[0-9]{2})"
SecAuditLogParts ADEFHZ
SecAuditLogType Serial
SecAuditLogFormat json
SecAuditLog /dev/stdout
