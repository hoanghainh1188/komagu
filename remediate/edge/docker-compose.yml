services:
  kong:
    image: kong:3.6
    container_name: komagu-kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_HEADERS: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KOMAGU_JWT_SECRET: ${KOMAGU_JWT_SECRET:-komagu-default-test-jwt-secret-key-32chars}
    volumes:
      - ${KOMAGU_KONG_CONFIG:-./kong/kong.yaml}:/kong/declarative/kong.yaml:ro
    ports:
      - "${KOMAGU_EDGE_BIND:-0.0.0.0}:8000:8000"  # Public API Gateway proxy port
      - "127.0.0.1:8001:8001"  # Kong Admin API bound strictly to loopback interface on host
    depends_on:
      - coraza-waf
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: komagu-redis
    expose:
      - "6379"
    restart: unless-stopped

  coraza-waf:
    build:
      context: ./coraza
    image: komagu-coraza-caddy:local
    container_name: komagu-coraza-waf
    environment:
      KOMAGU_UPSTREAM: ${KOMAGU_UPSTREAM:-http://mock-backend:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./coraza/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./coraza/coraza.conf:/etc/coraza/coraza.conf:ro
      - ./coraza/rules:/etc/coraza/rules:ro
      - ${KOMAGU_VIRTUAL_PATCH_FILE:-./coraza/rules/virtual-patches.conf}:/etc/coraza/rules/virtual-patches.conf:ro
    expose:
      - "8080"
    depends_on:
      - mock-backend
    restart: unless-stopped

  mock-backend:
    build:
      context: ./mock-backend
    container_name: komagu-mock-backend
    expose:
      - "5000"
    restart: unless-stopped
