services:
  kong:
    image: kong:3.6
    container_name: komainu-kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yaml
      KONG_HEADERS: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
    volumes:
      - ./kong/kong.yaml:/kong/declarative/kong.yaml:ro
    ports:
      - "8000:8000"  # Public API Gateway proxy port
      - "127.0.0.1:8001:8001"  # Kong Admin API bound strictly to loopback interface
    depends_on:
      - coraza-waf
    restart: unless-stopped

  coraza-waf:
    build:
      context: ./coraza
    image: komainu-coraza-caddy:local
    container_name: komainu-coraza-waf
    volumes:
      - ./coraza/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./coraza/coraza.conf:/etc/coraza/coraza.conf:ro
      - ./coraza/rules:/etc/coraza/rules:ro
    expose:
      - "8080"
    depends_on:
      - mock-backend
    restart: unless-stopped

  mock-backend:
    build:
      context: ./mock-backend
    container_name: komainu-mock-backend
    expose:
      - "5000"
    restart: unless-stopped
