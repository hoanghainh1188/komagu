# golangci-lint v2 configuration (security-focused; naming/style linters are off).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
